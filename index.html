<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rene Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Rene Coach</title>
<style>
:root{--bg:#0b1020;--card:#141b2e;--card2:#1b2440;--line:#26304d;--text:#e8ecf5;--mute:#8e99b8;--acc:#22c55e;--acc2:#38bdf8;--warn:#f59e0b;--bad:#ef4444;--sweet:#f59e0b;--rich:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .sub{font-size:12px;color:var(--mute);font-weight:500}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 10px;font-size:15px}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.mute{color:var(--mute)} .small{font-size:13px} .tiny{font-size:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);margin-right:4px}
.pill.g{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#86efac}
.pill.b{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.4);color:#7dd3fc}
.pill.y{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:#fcd34d}
.pill.p{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.4);color:#c4b5fd}
.pill.r{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5}
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#052e14;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;width:100%}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.next{background:linear-gradient(135deg,#153a2a,#12304a);border:1px solid #1f5c46}
.next .big{font-size:20px;font-weight:800;margin:4px 0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .time{width:52px;flex:none;font-weight:700;color:var(--acc2);font-size:14px;padding-top:2px}
.tl .body{flex:1;min-width:0}
.tl .ttl{font-weight:650}
.tl .d{font-size:13px;color:var(--mute)}
.chk{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--line);background:transparent;color:#052e14;font-weight:900;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.done .ttl{text-decoration:line-through;color:var(--mute)}
.linkish{color:var(--acc2);font-size:13px;font-weight:600;background:none;border:0;padding:0;margin-top:3px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(15,21,40,.97);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--text)}
nav button.on .ic{filter:none;transform:scale(1.08)}
.ex{border:1px solid var(--line);border-radius:16px;margin:0 0 10px;background:var(--card)}
.ex .hd{padding:12px 14px;display:flex;gap:10px;align-items:center}
.ex .hd .n{font-weight:700;flex:1}
.ex .num{width:28px;height:28px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.ex.fin .num{background:var(--acc);color:#052e14}
.ex .bd{padding:0 14px 14px;display:none}
.ex.open .bd{display:block}
.cues{margin:6px 0 10px;padding-left:18px}
.cues li{margin:2px 0}
.sets{width:100%;border-collapse:collapse;margin:6px 0}
.sets th{font-size:11px;color:var(--mute);text-align:left;font-weight:600;padding:2px 4px}
.sets td{padding:3px 4px}
.sets input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 8px;font-size:16px;text-align:center}
input,select,textarea{font:inherit}
.fld{display:block;margin:8px 0}
.fld span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-size:16px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.days button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px}
.days button.on{background:var(--acc2);color:#04263a;border-color:var(--acc2)}
.days button.today{box-shadow:inset 0 -3px 0 var(--acc)}
.embed{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.thumb{width:100%;border-radius:12px;margin:8px 0;display:block;max-height:420px;object-fit:cover}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none}
.modal.on{display:block}
.modal header{position:sticky}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;color:var(--text)}
.lesson .t{font-weight:700;font-size:14px;margin-bottom:4px}
.lesson.seen{border-color:#1f5c46}
.swiper{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:14px;scrollbar-width:none}
.swiper::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 8px);scroll-snap-align:center;background:linear-gradient(160deg,#18223d,#101729);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:62vh;display:flex;flex-direction:column}
.slide h3{font-size:24px;margin:0 0 14px;line-height:1.2}
.slide p{font-size:18px;white-space:pre-line;margin:0}
.slide img{width:100%;max-height:36vh;object-fit:cover;border-radius:14px;margin-top:14px}
.dots{display:flex;justify-content:center;gap:6px;padding-bottom:10px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--acc);width:18px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;background:#0e3b27;border:1px solid var(--acc);border-radius:18px;padding:12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer.on{display:flex}
.timer .tt{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;flex:1}
.md h1{font-size:22px} .md h2{font-size:19px;margin-top:22px} .md h3{font-size:16px}
.md table{border-collapse:collapse;width:100%;font-size:13px;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:6px;vertical-align:top}
.md th{background:var(--card2)}
.md a{color:var(--acc2)}
.md p,.md li{font-size:15px}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.team{border-radius:14px;padding:10px;margin:6px 0;border:1px solid var(--line)}
.painrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.painrow span{width:110px;font-size:14px}
.painrow input{flex:1}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:#052e14;font-weight:700;padding:10px 16px;border-radius:12px;z-index:30;display:none}
.onb{min-height:100vh;display:flex;flex-direction:column;padding:calc(30px + env(safe-area-inset-top)) 20px 30px;max-width:560px;margin:0 auto}
.onb h1{font-size:28px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px}
.chips button.on{background:var(--acc2);color:#04263a;border-color:var(--acc2);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div class="timer" id="timer"><div><div class="tiny mute">Rest</div><div class="tt" id="tt">0:00</div></div><button class="btn sm sec" onclick="Timer.add(30)">+30s</button><button class="btn sm" onclick="Timer.stop()">Done</button></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="learn.js"></script>
<script src="app.js"></script>
</body>
</html>
